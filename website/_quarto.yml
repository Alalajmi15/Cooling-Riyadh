project:
  type: website
  output-dir: ../docs

website:
  title: "Cooling Riyadh"
  favicon: assets/images/cooling-riyadh-logo.png

  navbar:
    background: "#174D38"
    foreground: "#F0E7D4"
    logo: assets/images/cooling-riyadh-logo.png
    logo-alt: "Cooling Riyadh"

    left:
      - href: index.qmd
        text: Home
      - href: urban-heat.qmd
        text: Urban Heat
      - href: vegetation-buildings.qmd
        text: Vegetation & Buildings
      - href: population.qmd
        text: Population Exposure
      - href: priority.qmd
        text: AI & Priority Areas
      - href: methods.qmd
        text: Methods & Data

    right:
      - href: index-ar.qmd
        text: العربية

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    smooth-scroll: true

    include-before-body:
      - text: |
          <style>

          .navbar {
            min-height: 86px !important;
          }

          .navbar-container {
            justify-content: flex-start !important;
          }

          .navbar-brand {
            display: flex !important;
            align-items: center !important;
            margin-right: 34px !important;
          }

          .navbar-logo,
          .navbar-brand img {
            width: 72px !important;
            height: 72px !important;
            max-height: 72px !important;
            object-fit: contain !important;
            margin-right: 14px !important;
          }

          .navbar-brand-container {
            flex-shrink: 0 !important;
          }

          .navbar-nav {
            margin-left: 0 !important;
            justify-content: flex-start !important;
            gap: 8px;
          }

          .navbar .nav-link {
            white-space: nowrap;
          }

          /* Active page underline */
          .navbar .nav-link.active {
            position: relative;
          }

          .navbar .nav-link.active::after {
            content: "";
            position: absolute;
            left: 10%;
            right: 10%;
            bottom: -4px;
            height: 4px;
            background: #C5A45A;
            border-radius: 999px;
          }

          .najdi-line-banner {
            width: 100%;
            height: 185px;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #ffffff;
            position: relative;
          }

          .najdi-line-banner img {
            position: absolute;
            width: 100%;
            height: auto;
            left: 0;
            top: -185px;
            object-fit: contain;
            opacity: 0.18;
            margin: 0;
            padding: 0;
          }

          body.arabic-page .navbar-container {
            direction: rtl !important;
          }

          body.arabic-page .navbar-nav {
            direction: rtl !important;
          }

          body.arabic-page .navbar-brand {
            margin-right: 0 !important;
            margin-left: 34px !important;
          }

          body.arabic-page .navbar-brand img {
            margin-right: 0 !important;
            margin-left: 14px !important;
          }

          @media (max-width: 1000px) {

            .navbar {
              min-height: 76px !important;
            }

            .navbar-logo,
            .navbar-brand img {
              width: 62px !important;
              height: 62px !important;
              max-height: 62px !important;
            }

            .najdi-line-banner {
              height: 150px;
            }

            .najdi-line-banner img {
              top: -140px;
              opacity: 0.17;
            }
          }

          @media (max-width: 600px) {

            .navbar {
              min-height: 68px !important;
            }

            .navbar-logo,
            .navbar-brand img {
              width: 52px !important;
              height: 52px !important;
              max-height: 52px !important;
            }

            .najdi-line-banner {
              height: 110px;
            }

            .najdi-line-banner img {
              top: -85px;
              opacity: 0.16;
            }
          }

          </style>

          <div class="najdi-line-banner">
            <img
              src="assets/images/najdi-line-banner.png"
              alt="Traditional Saudi architectural line illustration">
          </div>

    include-after-body:
      - text: |
          <script>
          document.addEventListener("DOMContentLoaded", function () {

            const path = window.location.pathname.toLowerCase();

            const isArabic =
              path.endsWith("index-ar.html") ||
              path.endsWith("urban-heat-ar.html") ||
              path.endsWith("vegetation-buildings-ar.html") ||
              path.endsWith("population-ar.html") ||
              path.endsWith("priority-ar.html") ||
              path.endsWith("methods-ar.html");

            if (!isArabic) return;

            document.body.classList.add("arabic-page");
            document.documentElement.setAttribute("lang", "ar");
            document.documentElement.setAttribute("dir", "rtl");

            const brandTitle = document.querySelector(".navbar-title");

            if (brandTitle) {
              brandTitle.textContent = "تبريد الرياض";
            }

            const links = document.querySelectorAll(".navbar a.nav-link");

            links.forEach(function(link) {

              link.classList.remove("active");

              const href = link.getAttribute("href") || "";
              const currentText = link.textContent.trim();

              if (
                currentText === "Home" ||
                href === "./" ||
                href.endsWith("index.html")
              ) {
                link.textContent = "الرئيسية";
                link.setAttribute("href", "index-ar.html");

                if (path.endsWith("index-ar.html")) {
                  link.classList.add("active");
                }
              }

              else if (
                currentText === "Urban Heat" ||
                href.includes("urban-heat")
              ) {
                link.textContent = "الحرارة الحضرية";
                link.setAttribute("href", "urban-heat-ar.html");

                if (path.endsWith("urban-heat-ar.html")) {
                  link.classList.add("active");
                }
              }

              else if (
                currentText === "Vegetation & Buildings" ||
                href.includes("vegetation-buildings")
              ) {
                link.textContent = "الغطاء النباتي والمباني";
                link.setAttribute("href", "vegetation-buildings-ar.html");

                if (path.endsWith("vegetation-buildings-ar.html")) {
                  link.classList.add("active");
                }
              }

              else if (
                currentText === "Population Exposure" ||
                href.includes("population")
              ) {
                link.textContent = "التعرض السكاني";
                link.setAttribute("href", "population-ar.html");

                if (path.endsWith("population-ar.html")) {
                  link.classList.add("active");
                }
              }

              else if (
                currentText === "AI & Priority Areas" ||
                href.includes("priority")
              ) {
                link.textContent = "الذكاء الاصطناعي ومناطق الأولوية";
                link.setAttribute("href", "priority-ar.html");

                if (path.endsWith("priority-ar.html")) {
                  link.classList.add("active");
                }
              }

              else if (
                currentText === "Methods & Data" ||
                href.includes("methods")
              ) {
                link.textContent = "المنهجية والبيانات";
                link.setAttribute("href", "methods-ar.html");

                if (path.endsWith("methods-ar.html")) {
                  link.classList.add("active");
                }
              }

              else if (
                currentText === "العربية" ||
                href.includes("index-ar")
              ) {
                link.textContent = "English";

                if (path.endsWith("urban-heat-ar.html")) {
                  link.setAttribute("href", "urban-heat.html");
                }

                else if (path.endsWith("vegetation-buildings-ar.html")) {
                  link.setAttribute("href", "vegetation-buildings.html");
                }

                else if (path.endsWith("population-ar.html")) {
                  link.setAttribute("href", "population.html");
                }

                else if (path.endsWith("priority-ar.html")) {
                  link.setAttribute("href", "priority.html");
                }

                else if (path.endsWith("methods-ar.html")) {
                  link.setAttribute("href", "methods.html");
                }

                else {
                  link.setAttribute("href", "index.html");
                }
              }

            });

          });
          </script>

execute:
  freeze: auto