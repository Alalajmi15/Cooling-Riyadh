project:
  type: website
  output-dir: ../docs

website:
  title: "Cooling Riyadh"

  navbar:
    background: "#174D38"
    foreground: "#F0E7D4"
    logo: assets/images/cooling-riyadh-logo.png
    logo-alt: "Cooling Riyadh"

    left:
      - href: index.qmd
        text: Home
      - href: urban-heat.qmd
        text: Urban Heat
      - href: vegetation-buildings.qmd
        text: Vegetation & Buildings
      - href: population.qmd
        text: Population Exposure
      - href: priority.qmd
        text: AI & Priority Areas
      - href: methods.qmd
        text: Methods & Data

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    smooth-scroll: true

    include-before-body:
      - text: |
          <style>

          /* ==================================================
             NAVBAR
          ================================================== */

          .navbar {
            min-height: 86px !important;
          }

          .navbar-container {
            justify-content: flex-start !important;
          }

          .navbar-brand {
            display: flex !important;
            align-items: center !important;
            margin-right: 34px !important;
          }

          .navbar-logo,
          .navbar-brand img {
            width: 72px !important;
            height: 72px !important;
            max-height: 72px !important;
            object-fit: contain !important;
            margin-right: 14px !important;
          }

          .navbar-brand-container {
            flex-shrink: 0 !important;
          }

          .navbar-nav {
            margin-left: 0 !important;
            justify-content: flex-start !important;
            gap: 8px;
          }

          .navbar .nav-link {
            white-space: nowrap;
          }


          /* ==================================================
             NAJDI LINE BANNER
          ================================================== */

          .najdi-line-banner {
            width: 100%;
            height: 185px;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #ffffff;
            position: relative;
          }

          .najdi-line-banner img {
            position: absolute;

            width: 100%;
            height: auto;

            left: 0;

            /* move the full drawing upward into view */
            top: -185px;

            /* show the complete artwork without cropping */
            object-fit: contain;

            /* much softer watermark */
            opacity: 0.18;

            margin: 0;
            padding: 0;
          }


          /* ==================================================
             TABLET
          ================================================== */

          @media (max-width: 1000px) {

            .navbar {
              min-height: 76px !important;
            }

            .navbar-logo,
            .navbar-brand img {
              width: 62px !important;
              height: 62px !important;
              max-height: 62px !important;
            }

            .najdi-line-banner {
              height: 150px;
            }

            .najdi-line-banner img {
              top: -140px;
              opacity: 0.17;
            }
          }


          /* ==================================================
             MOBILE
          ================================================== */

          @media (max-width: 600px) {

            .navbar {
              min-height: 68px !important;
            }

            .navbar-logo,
            .navbar-brand img {
              width: 52px !important;
              height: 52px !important;
              max-height: 52px !important;
            }

            .najdi-line-banner {
              height: 110px;
            }

            .najdi-line-banner img {
              top: -85px;
              opacity: 0.16;
            }
          }

          </style>

          <div class="najdi-line-banner">
            <img
              src="assets/images/najdi-line-banner.png"
              alt="Traditional Saudi architectural line illustration">
          </div>

execute:
  freeze: auto